 bhutan_events.1.t: "[GetYear]年帝国会议"
 bhutan_events.1.s: " 组建一个横跨整个世界超级联邦的概念已存在有半个世纪之久，但之前的帝国会议未能就这个问题做出决定。在眼睁睁看着自治领们走上领土自治的道路之前，加拿大凭借最后一次机会。使其他自治领明白，这对他们的人民和对整个国家联合体来说都是最佳的解决方案，所有成员国在外交和国内政策上都会享有发言权。他们说，这是相比会导致我们完全独立的“自治”理念而言一个可行的替代方案。"
 bhutan_events.1.k: "没有不列颠本土的英联邦？"
 tibet_events.10.t: "不列颠传单袭击加拿大"
 tibet_events.10.d: "前线阵地领空中大量英国飞机入侵，散播红色病毒，前线士气崩溃。"
 tibet_events.10.a: "你妈了个逼"
 tibet_events.49.f: "德国炸毁莱茵河大坝"
 tibet_events.49.s: "德法战争中，法军在占领比利时和阿尔萨斯洛林后，准备进军莱茵河，夺取自然边界。为了阻止法军前进，威廉二世下令炸开法兰克福大堤。打破了法军的作战计划，为保卫莱茵争取了时间。但同时也淹没了普法尔茨、符腾堡、科隆、巴登等莱茵河的大片土地，给广大德国人民造成极大的灾难，20余万人惨遭溺死，百万人流离失所，并形成连年灾荒的地区。"
 tibet_events.49.m: "看来德国是要背水一战了"